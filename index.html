<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>❤️学霸教育数学速算小游戏❤️</title>
    <style>
        body {
            font-family: 'Comic Sans MS', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background-color: #FFF5E6;
            text-align: center;
            padding: 10px;
            color: #FF6B88;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        .game-container {
            background-color: white;
            border-radius: 20px;
            padding: 20px;
            max-width: 500px;
            margin: 0 auto;
            box-shadow: 0 8px 15px rgba(255, 107, 136, 0.2);
            position: relative;
        }

        h1 {
            color: #FF6B88;
            font-size: clamp(1.5em, 5vw, 2em);
            margin-bottom: 10px;
            word-break: break-word;
        }

        .subtitle {
            color: #FF9E7D;
            margin-bottom: 15px;
            font-size: clamp(0.8em, 3vw, 0.9em);
        }

        .player-name {
            margin-bottom: 15px;
        }

        .player-name input {
            font-size: 1em;
            padding: 8px 12px;
            border: 2px solid #FFD166;
            border-radius: 15px;
            text-align: center;
            color: #4D96FF;
            width: 60%;
            max-width: 200px;
        }

        .problem {
            font-size: clamp(2em, 8vw, 2.5em);
            margin: 20px 0;
            color: #6BCB77;
            word-break: break-word;
        }

        input {
            font-size: clamp(1.3em, 5vw, 1.5em);
            padding: 10px 15px;
            border: 3px solid #FFD166;
            border-radius: 15px;
            width: 100px;
            text-align: center;
            color: #6BCB77;
            transition: all 0.3s;
            -webkit-appearance: none;
            margin: 0 auto;
            display: block;
        }

        input.correct {
            border-color: #6BCB77;
            background-color: #E8F5E9;
        }

        input.incorrect {
            border-color: #FF6B88;
            background-color: #FFEBEE;
        }

        .score {
            font-size: clamp(1em, 4vw, 1.1em);
            margin-top: 15px;
            color: #4D96FF;
        }

        .timer {
            font-size: clamp(1.1em, 4vw, 1.3em);
            color: #FF9E7D;
            margin: 10px 0;
        }

        .emoji {
            font-size: clamp(1.2em, 4vw, 1.5em);
            margin: 0 3px;
        }

        .stars {
            font-size: clamp(1.5em, 5vw, 1.8em);
            margin: 15px 0;
        }

        .history {
            margin-top: 20px;
            border-top: 2px dashed #FFD166;
            padding-top: 15px;
        }

        .history h3 {
            color: #FF9E7D;
            font-size: clamp(1em, 4vw, 1.2em);
        }

        .history-controls {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }

        .history-btn {
            background-color: #FFD166;
            border: none;
            border-radius: 15px;
            padding: 5px 12px;
            font-size: clamp(0.7em, 3vw, 0.8em);
            cursor: pointer;
            transition: all 0.3s;
            min-width: 60px;
        }

        .history-btn.active {
            background-color: #FF9E7D;
            color: white;
        }

        .history-btn:hover {
            transform: scale(1.05);
        }

        .history-list {
            max-height: 150px;
            overflow-y: auto;
            text-align: left;
            padding: 8px;
            background-color: #FFF9F0;
            border-radius: 10px;
            font-size: clamp(0.8em, 3vw, 0.9em);
        }

        .history-item {
            margin: 5px 0;
            padding: 5px;
            border-bottom: 1px solid #FFE8D6;
            word-break: break-word;
        }

        .history-correct {
            color: #6BCB77;
        }

        .history-incorrect {
            color: #FF6B88;
        }

        .feedback {
            font-size: clamp(1em, 4vw, 1.1em);
            margin: 10px 0;
            min-height: 20px;
            word-break: break-word;
        }

        .feedback.correct {
            color: #6BCB77;
        }

        .feedback.incorrect {
            color: #FF6B88;
        }

        .summary {
            background-color: #FFF9F0;
            border-radius: 15px;
            padding: 15px;
            margin: 15px 0;
            display: none;
        }

        .summary h3 {
            color: #FF9E7D;
            margin-top: 0;
            font-size: clamp(1em, 4vw, 1.2em);
        }

        .player-summary {
            font-size: clamp(1em, 4vw, 1.2em);
            color: #4D96FF;
            margin-bottom: 10px;
        }

        .summary-item {
            display: flex;
            justify-content: space-between;
            margin: 5px 0;
            font-size: clamp(0.9em, 3vw, 1em);
        }

        .operation-selector {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .operation-btn {
            background-color: #4D96FF;
            color: white;
            border: none;
            border-radius: 15px;
            padding: 8px 15px;
            font-size: clamp(0.8em, 3vw, 0.9em);
            cursor: pointer;
            transition: all 0.3s;
        }

        .operation-btn.active {
            background-color: #FF6B88;
            transform: scale(1.05);
            box-shadow: 0 4px 8px rgba(255, 107, 136, 0.3);
        }

        .operation-btn:hover {
            transform: scale(1.05);
        }

        .music-control {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            font-size: clamp(1.2em, 4vw, 1.5em);
            cursor: pointer;
            color: #FF9E7D;
        }

        @media (max-width: 320px) {
            .player-name input {
                width: 80%;
            }
            
            input {
                width: 80px;
            }
            
            .operation-btn {
                padding: 6px 10px;
            }
        }

        @supports (-webkit-touch-callout: none) {
            body {
                -webkit-text-size-adjust: 100%;
            }
        }
    </style>
</head>
<body>
<div class="game-container">
    <button class="music-control" id="music-toggle">🔊</button>
    <h1>❤️学霸教育数学速算小游戏❤️ <span class="emoji">✨</span></h1>
    <p class="subtitle">选择题目类型，输入答案后自动检查对错</p>
    
    <div class="player-name">
        <input type="text" id="player-name" placeholder="输入你的名字" maxlength="10">
    </div>

    <div class="operation-selector">
        <button class="operation-btn active" data-operation="add">加法➕</button>
        <button class="operation-btn" data-operation="subtract">减法➖</button>
        <button class="operation-btn" data-operation="multiply">乘法✖️</button>
        <button class="operation-btn" data-operation="divide">除法➗</button>
    </div>

    <div class="timer" id="timer">时间: 60秒</div>

    <div class="stars" id="stars">
        <span class="emoji">⭐</span>
        <span class="emoji">⭐</span>
        <span class="emoji">⭐</span>
    </div>

    <div class="problem" id="problem">5 × 3 = ?</div>

    <input type="number" id="answer" placeholder="答案" autofocus>
    <div class="feedback" id="feedback"></div>

    <div class="score" id="score">得分: 0 | 星星: 3</div>

    <div class="summary" id="summary">
        <h3>答题总结 <span class="emoji">📊</span></h3>
        <div class="player-summary" id="player-summary">小玩家的成绩</div>
        <div class="summary-item">
            <span>总答题数:</span>
            <span id="total-answers">0</span>
        </div>
        <div class="summary-item">
            <span>正确:</span>
            <span id="correct-answers">0</span>
        </div>
        <div class="summary-item">
            <span>错误:</span>
            <span id="wrong-answers">0</span>
        </div>
        <div class="summary-item">
            <span>正确率:</span>
            <span id="accuracy">0%</span>
        </div>
    </div>

    <div class="history">
        <h3>答题历史 <span class="emoji">📝</span></h3>
        <div class="history-controls">
            <button class="history-btn active" id="show-all">全部</button>
            <button class="history-btn" id="show-correct">正确</button>
            <button class="history-btn" id="show-incorrect">错误</button>
        </div>
        <div class="history-list" id="history-list">
            <p>还没有答题记录哦~</p>
        </div>
    </div>
</div>

<audio id="correct-sound" src="https://assets.mixkit.co/sfx/preview/mixkit-correct-answer-tone-2870.mp3" preload="auto"></audio>
<audio id="wrong-sound" src="https://assets.mixkit.co/sfx/preview/mixkit-wrong-answer-fail-notification-946.mp3" preload="auto"></audio>
<audio id="star-sound" src="https://assets.mixkit.co/sfx/preview/mixkit-achievement-bell-600.mp3" preload="auto"></audio>
<audio id="lose-star-sound" src="https://assets.mixkit.co/sfx/preview/mixkit-arcade-retro-game-over-213.mp3" preload="auto"></audio>
<audio id="bg-music" loop src="https://assets.mixkit.co/music/preview/mixkit-game-show-suspense-waiting-668.mp3" preload="auto"></audio>

<script>
    let score = 0;
    let stars = 3;
    let num1, num2, correctAnswer;
    let history = [];
    let isChecking = false;
    let historyFilter = 'all';
    let operation = 'multiply';
    let timeLeft = 60;
    let timer;
    let correctCount = 0;
    let wrongCount = 0;
    let gameStarted = false;
    let playerName = '小玩家';
    let musicOn = true;
    let audioContextInitialized = false;

    const correctSound = document.getElementById('correct-sound');
    const wrongSound = document.getElementById('wrong-sound');
    const starSound = document.getElementById('star-sound');
    const loseStarSound = document.getElementById('lose-star-sound');
    const bgMusic = document.getElementById('bg-music');

    function initAudioContext() {
        if (audioContextInitialized) return;
        
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext) {
            const audioContext = new AudioContext();
            if (audioContext.state === 'suspended') {
                audioContext.resume();
            }
        }
        
        [correctSound, wrongSound, starSound, loseStarSound, bgMusic].forEach(audio => {
            audio.load();
        });
        
        audioContextInitialized = true;
    }

    function playAudio(audioElement) {
        if (!musicOn) return;
        
        audioElement.currentTime = 0;
        audioElement.play().catch(e => {
            console.log('音频播放被阻止:', e);
            initAudioContext();
            audioElement.play().catch(e => console.log('重试播放失败:', e));
        });
    }

    function initGame() {
        score = 0;
        stars = 3;
        history = [];
        correctCount = 0;
        wrongCount = 0;
        timeLeft = 60;
        gameStarted = false;
        
        // 获取玩家名字，如果没有输入则使用默认值"小玩家"
        const nameInput = document.getElementById('player-name');
        playerName = nameInput.value.trim() || '小玩家';
        
        // 更新玩家名字显示
        document.getElementById('player-summary').textContent = `${playerName}的成绩`;
        
        updateStars();
        updateHistoryDisplay();
        updateSummary();
        document.getElementById('timer').textContent = `时间: ${timeLeft}秒`;
        document.getElementById('summary').style.display = 'none';
        
        if (timer) {
            clearInterval(timer);
        }
        
        initAudioContext();
    }

    function toggleMusic() {
        musicOn = !musicOn;
        document.getElementById('music-toggle').textContent = musicOn ? '🔊' : '🔇';
        
        if (musicOn) {
            playAudio(bgMusic);
        } else {
            bgMusic.pause();
        }
    }

    function startGame() {
        if (gameStarted) return;
        
        gameStarted = true;
        generateProblem();
        
        timer = setInterval(() => {
            timeLeft--;
            document.getElementById('timer').textContent = `时间: ${timeLeft}秒`;
            
            if (timeLeft <= 0) {
                endGame();
            }
        }, 1000);
    }

    function endGame() {
        clearInterval(timer);
        document.getElementById('answer').disabled = true;
        document.getElementById('summary').style.display = 'block';
        
        // 确保使用当前玩家名字
        document.getElementById('player-summary').textContent = `${playerName}的成绩`;
        
        updateSummary();
        bgMusic.pause();
        
        setTimeout(() => {
            alert(`${playerName}，时间到！\n你的最终得分是: ${score}\n正确: ${correctCount}题\n错误: ${wrongCount}题`);
        }, 500);
    }

    function resetGame() {
        initGame();
        generateProblem();
        document.getElementById('answer').disabled = false;
        document.getElementById('answer').focus();
    }

    function generateProblem() {
        if (!gameStarted) return;
        
        isChecking = false;
        
        switch (operation) {
            case 'add':
                num1 = Math.floor(Math.random() * 50) + 1;
                num2 = Math.floor(Math.random() * 50) + 1;
                correctAnswer = num1 + num2;
                document.getElementById('problem').textContent = `${num1} + ${num2} = ?`;
                break;
            case 'subtract':
                num1 = Math.floor(Math.random() * 50) + 1;
                num2 = Math.floor(Math.random() * num1) + 1;
                correctAnswer = num1 - num2;
                document.getElementById('problem').textContent = `${num1} - ${num2} = ?`;
                break;
            case 'multiply':
                num1 = Math.floor(Math.random() * 10) + 1;
                num2 = Math.floor(Math.random() * 10) + 1;
                correctAnswer = num1 * num2;
                document.getElementById('problem').textContent = `${num1} × ${num2} = ?`;
                break;
            case 'divide':
                num2 = Math.floor(Math.random() * 10) + 1;
                correctAnswer = Math.floor(Math.random() * 10) + 1;
                num1 = num2 * correctAnswer;
                document.getElementById('problem').textContent = `${num1} ÷ ${num2} = ?`;
                break;
        }

        const answerInput = document.getElementById('answer');
        answerInput.value = '';
        answerInput.className = '';
        answerInput.focus();
        answerInput.disabled = false;

        document.getElementById('feedback').textContent = '';
        document.getElementById('feedback').className = 'feedback';
    }

    function updateStars() {
        const starsContainer = document.getElementById('stars');
        starsContainer.innerHTML = '';

        for (let i = 0; i < stars; i++) {
            starsContainer.innerHTML += '<span class="emoji">⭐</span>';
        }

        for (let i = stars; i < 3; i++) {
            starsContainer.innerHTML += '<span class="emoji" style="opacity:0.3;">⭐</span>';
        }

        document.getElementById('score').textContent = `得分: ${score} | 星星: ${stars}`;
    }

    function updateSummary() {
        const total = correctCount + wrongCount;
        const accuracy = total > 0 ? Math.round((correctCount / total) * 100) : 0;
        
        document.getElementById('total-answers').textContent = total;
        document.getElementById('correct-answers').textContent = correctCount;
        document.getElementById('wrong-answers').textContent = wrongCount;
        document.getElementById('accuracy').textContent = `${accuracy}%`;
    }

    function addHistory(isCorrect, userAnswer) {
        let operationSymbol;
        switch (operation) {
            case 'add': operationSymbol = '+'; break;
            case 'subtract': operationSymbol = '-'; break;
            case 'multiply': operationSymbol = '×'; break;
            case 'divide': operationSymbol = '÷'; break;
        }

        const historyItem = {
            problem: `${num1} ${operationSymbol} ${num2}`,
            answer: correctAnswer,
            userAnswer: userAnswer,
            isCorrect: isCorrect,
            time: new Date().toLocaleTimeString()
        };

        history.unshift(historyItem);

        if (history.length > 10) {
            history.pop();
        }

        updateHistoryDisplay();
    }

    function updateHistoryDisplay() {
        const historyList = document.getElementById('history-list');
        historyList.innerHTML = '';

        if (history.length === 0) {
            historyList.innerHTML = '<p>还没有答题记录哦~</p>';
            return;
        }

        const filteredHistory = history.filter(item => {
            if (historyFilter === 'all') return true;
            if (historyFilter === 'correct') return item.isCorrect;
            if (historyFilter === 'incorrect') return !item.isCorrect;
            return true;
        });

        if (filteredHistory.length === 0) {
            historyList.innerHTML = `<p>没有${historyFilter === 'correct' ? '正确' : '错误'}的答题记录~</p>`;
            return;
        }

        filteredHistory.forEach(item => {
            const historyItem = document.createElement('div');
            historyItem.className = `history-item ${item.isCorrect ? 'history-correct' : 'history-incorrect'}`;

            const icon = item.isCorrect ? '✅' : '❌';
            historyItem.innerHTML = `
                <strong>${icon} ${item.problem} = ${item.answer}</strong>
                <br>
                你的答案: ${item.userAnswer} (${item.time})
            `;

            historyList.appendChild(historyItem);
        });
    }

    function setHistoryFilter(filter) {
        historyFilter = filter;
        updateHistoryDisplay();

        document.getElementById('show-all').classList.remove('active');
        document.getElementById('show-correct').classList.remove('active');
        document.getElementById('show-incorrect').classList.remove('active');

        document.getElementById(`show-${filter}`).classList.add('active');
    }

    function setOperation(op) {
        operation = op;
        initGame();
        
        document.querySelectorAll('.operation-btn').forEach(btn => {
            btn.classList.remove('active');
        });
        document.querySelector(`.operation-btn[data-operation="${op}"]`).classList.add('active');
        
        startGame();
    }

    function checkAnswer() {
        if (isChecking || !gameStarted) return;

        const userAnswer = parseInt(document.getElementById('answer').value);
        if (isNaN(userAnswer)) return;

        isChecking = true;
        const answerInput = document.getElementById('answer');
        const feedback = document.getElementById('feedback');

        if (userAnswer === correctAnswer) {
            answerInput.className = 'correct';
            feedback.textContent = `正确！${num1} ${getOperationSymbol()} ${num2} = ${correctAnswer} 🎉`;
            feedback.className = 'feedback correct';
            score++;
            correctCount++;

            playAudio(correctSound);

            const starsElements = document.querySelectorAll('#stars .emoji');
            starsElements.forEach(star => {
                star.style.transform = 'scale(1.5)';
                star.style.transition = 'all 0.3s';
                setTimeout(() => {
                    star.style.transform = 'scale(1)';
                }, 300);
            });

            addHistory(true, userAnswer);

            setTimeout(() => {
                generateProblem();
                isChecking = false;
            }, 1000);
        } else {
            answerInput.className = 'incorrect';
            feedback.textContent = `不对哦！${num1} ${getOperationSymbol()} ${num2} 不等于 ${userAnswer}`;
            feedback.className = 'feedback incorrect';
            wrongCount++;

            playAudio(wrongSound);

            stars--;
            if (stars < 0) stars = 0;

            if (stars < 3) {
                playAudio(loseStarSound);
            }

            addHistory(false, userAnswer);

            if (stars <= 0) {
                setTimeout(() => {
                    endGame();
                }, 500);
                return;
            }

            isChecking = false;
        }

        updateStars();
        updateSummary();
    }

    function getOperationSymbol() {
        switch (operation) {
            case 'add': return '+';
            case 'subtract': return '-';
            case 'multiply': return '×';
            case 'divide': return '÷';
            default: return '×';
        }
    }

    // 事件监听
    document.getElementById('answer').addEventListener('input', function() {
        if (this.value.length === String(correctAnswer).length) {
            checkAnswer();
        }
    });

    document.getElementById('show-all').addEventListener('click', () => setHistoryFilter('all'));
    document.getElementById('show-correct').addEventListener('click', () => setHistoryFilter('correct'));
    document.getElementById('show-incorrect').addEventListener('click', () => setHistoryFilter('incorrect'));

    document.querySelectorAll('.operation-btn').forEach(btn => {
        btn.addEventListener('click', () => setOperation(btn.dataset.operation));
    });

    document.getElementById('music-toggle').addEventListener('click', toggleMusic);

    // 玩家名字输入变化时更新
    document.getElementById('player-name').addEventListener('input', function() {
        playerName = this.value.trim() || '小玩家';
        document.getElementById('player-summary').textContent = `${playerName}的成绩`;
    });

    // 初始设置乘法游戏
    setOperation('multiply');

    // 点击页面后初始化游戏
    document.addEventListener('click', function initGameOnFirstClick() {
        initAudioContext();
        playAudio(bgMusic);
        document.removeEventListener('click', initGameOnFirstClick);
    }, { once: true });

    // 解决iOS键盘问题
    window.addEventListener('resize', function() {
        if (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA') {
            window.scrollTo(0, 0);
        }
    });

    // 禁用双击缩放
    document.addEventListener('dblclick', function(e) {
        e.preventDefault();
    }, { passive: false });
</script>
</body>
</html>
